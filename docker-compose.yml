services:
  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${SQL_DBNAME:-excel_template_mapper}
      MYSQL_USER: ${SQL_USER:-app}
      MYSQL_PASSWORD: ${SQL_PASSWORD:-app}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${SQL_PASSWORD:-app}
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - sh
      - -c
      - mysql -hmysql -u${SQL_USER:-app} ${SQL_DBNAME:-excel_template_mapper} < /migrations/001_init.up.sql
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      SQL_USER: ${SQL_USER:-app}
      SQL_PASSWORD: ${SQL_PASSWORD:-app}
      SQL_NET: ${SQL_NET:-tcp}
      SQL_ADDR: mysql:3306
      SQL_DBNAME: ${SQL_DBNAME:-excel_template_mapper}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_GRAPHQL_ENDPOINT: ${VITE_GRAPHQL_ENDPOINT:-http://localhost:8080/query}

volumes:
  mysql_data:
